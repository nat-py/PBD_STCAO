<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga Inicial de datos - STCAO</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- HEADER SUPERIOR -->
  <header class="navbar navbar-expand-lg shadow-sm px-4 mb-4 fixed-top con-fondo" style="z-index: 1030;">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3 text-white">
        <i class="bi bi-bank2 display-6"></i>
        <span class="fw-bold fs-5">STCAO - XML</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-2 text-white">
          <i class="bi bi-person-circle"></i>
          <span class="fw-semibold">Administrador</span>
        </div>
      </div>
    </div>
  </header>

  <div class="d-flex justify-content-center align-items-center px-3" style="height: 82vh;">
      <!-- IMPORTAR -->
      <div class="card p-4 shadow-sm border-0" style="max-width: 1000px;">

        <h3 class="text-secondary fw-bold mb-3">Importar Base de Datos (XML)</h3>
        <div class="drop-zone" id="dropZoneXml">
          <i class="bi bi-cloud-arrow-up display-2 text-primary mb-2"></i>
          <h4 class="fw-bold">IMPORTAR XML</h5>
          <p class="text-muted medium m-0">Arrastre o seleccione un archivo XML del cual quiere que se genere o sobrescriba la base de datos.</p>
          <input type="file" id="fileInputXml" accept=".xml" class="d-none">
        </div>
        <div id="fileInfo" class="mt-2 text-success medium fw-semibold text-center"></div>
      </div>
  </div>


  <!-- FOOTER -->
  <footer class="bg-white text-center py-3 mt-5 shadow-sm border-top">
    <div class="container">
      <p class="mb-1 text-muted fw-semibold" style="color: var(--bs-primary) !important;">STCAO - Panel de Administración</p>
      <p class="mb-0 text-muted small">&copy; 2026 Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="carga.js"></script>
</body>
</html>
