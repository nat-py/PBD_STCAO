<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga Inicial de datos - STCAO</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- HEADER SUPERIOR -->
  <header class="navbar navbar-expand-lg shadow-sm px-4 mb-4 fixed-top con-fondo" style="z-index: 1030;">
    <div class="container-fluid d-flex justify-content-between align-items-center" >
      <!-- Izquierda: Icono y Nombre -->
      <div class="d-flex align-items-center gap-3" style="color: #F7FAFC;">
        <i class="bi bi-bank2 display-4"></i>
        <span class="fw-bold fs-5" >STCAO</span>
      </div>

      <!-- Derecha: Usuario y Salir -->
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-2" style="color: #F7FAFC;">
          <i class="bi bi-person-circle"></i>
          <span class="fw-semibold ">Paco Pacal</span>
        </div>

        <a href="../login/login.html" class="btn btn-outline-b d-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-right"></i>
          Salir
        </a>
      </div>
    </div>
  </header>

  <div style="margin-top: 120px;">
    <section id="seccion-estados" class="section-container fondo-b m-5" >
      <h2 id="bienvenida" class="mb-4 text-primary fw-bold"><i class="bi bi-file-earmark-text me-2"></i>Cuentas asociadas al usuario </h2>
      <div class="table-responsive">
        <table class="table table-hover align-middle bg-white rounded shadow-sm">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Fecha</th>
              <th>Saldo Inicial</th>
              <th>Saldo Final</th>
              <th>Interés Acumulado</th>
              <th>Cant. Retiros</th>
              <th>Cant. Depósitos</th>
            </tr>
          </thead>
          <tbody>
            <tr class="clickable-row btn-proceso">
              <td>1</td>
              <td>01/09/2026</td>
              <td>$1,000.00</td>
              <td>$1,250.00</td>
              <td>$12.50</td>
              <td>2</td>
              <td>3</td>
            </tr>
            <tr class="clickable-row btn-proceso">
              <td>2</td>
              <td>01/08/2026</td>
              <td>$800.00</td>
              <td>$1,000.00</td>
              <td>$10.00</td>
              <td>1</td>
              <td>2</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>


    <!-- FOOTER -->
  <footer class="bg-white text-center py-3 mt-5 shadow-sm border-top">
    <div class="container">
      <p class="mb-1 text-muted fw-semibold" style="color: var(--bs-primary) !important;">STCAO - Proyecto Bases de Datos</p>
      <p class="mb-0 text-muted small">&copy; 2026 Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script local -->
  <script src="listaCuentas.js"></script>
  </body>
</html>
