<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body >
      <!-- HEADER SUPERIOR -->
    <header class="navbar navbar-expand-lg shadow-sm px-4 mb-4 fixed-top con-fondo" style="z-index: 1030;">
      <div class="container-fluid d-flex justify-content-between align-items-center" >
        <!-- Izquierda: Icono y Nombre -->
        <div class="d-flex align-items-center gap-3" style="color: #F7FAFC;">
          <i class="bi bi-bank2 display-4"></i>
          <span class="fw-bold fs-5" >STCAO</span>
        </div>

        <!-- Derecha: Usuario y Salir -->
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2" style="color: #F7FAFC; cursor: pointer;" onclick="window.location.href='../dashboardAhorro/dashboardAhorro.html'">
            <i class="bi bi-currency-exchange"></i>
            <span class="fw-semibold ">Tipo de Cambio</span>
          </div>
        </div>

      </div>
    </header>

    <div class="d-flex justify-content-center align-items-center px-3" style="height: 100vh;">
      <div class="fondo-b p-5 w-100" style="max-width: 400px;">

        <h1 class="text-center display-3"><i class="bi bi-person-circle"></i></h1>
        <h2 class="text-center">Iniciar Sesión</h2>

        <form class="needs-validation" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input class="form-control" id="username" required>
            <div class="invalid-feedback">
              Favor ingresar usuario.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div class="invalid-feedback">
              Favor ingresar contraseña.
            </div>
          </div>

          <div class="alert alert-danger d-none" id="errorGeneral" role="alert">
            Usuario o contraseña incorrectos.
          </div>
          
          <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary">Ingresar</button>
          </div>

        </form>

      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white text-center py-3 shadow-sm border-top" style="position: fixed; bottom: 0; width: 100%;">
      <div class="container">
        <p class="mb-1 text-muted fw-semibold" style="color: var(--bs-primary) !important;">STCAO - Módulo de Ahorro</p>
        <p class="mb-0 text-muted small">&copy; 2026 Todos los derechos reservados.</p>
      </div>
    </footer>

    <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
